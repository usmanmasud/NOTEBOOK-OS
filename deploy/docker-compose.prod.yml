# Production on a Huawei Cloud ECS instance.
# Data services are managed Huawei Cloud services reached over the VPC:
#   RDS for MySQL (DATABASE_URL), DCS for Redis (REDIS_URL), OBS (STORAGE_BACKEND=obs).
#
#   cp deploy/env.production.example deploy/.env.production   # fill in values
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# HTTPS: either put a Huawei ELB with an HTTPS listener in front of port 8080
# (recommended), or start the optional Caddy proxy:  --profile caddy

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      OTP_DEV_ECHO: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Only the ELB (or Caddy) should reach this; restrict with the ECS security group.
      - "8080:8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN for automatic HTTPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
