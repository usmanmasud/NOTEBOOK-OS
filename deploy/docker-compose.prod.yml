# Production on a Huawei Cloud ECS instance.
#
#   ECS  : runs this file (frontend/nginx, backend/FastAPI, Redis, Caddy for HTTPS)
#   RDS  : Huawei Cloud RDS for MySQL, reached over the VPC (DATABASE_URL)
#   Files: notebook photos on the ECS disk (volume `uploads`), or OBS with STORAGE_BACKEND=obs
#   Redis: container below by default; point REDIS_URL at Huawei DCS to use the managed service
#
#   sh deploy/ecs-setup.sh            # first time (installs Docker, creates deploy/.env.production)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      OTP_DEV_ECHO: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      - redis
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Public entry point: HTTPS with an automatic Let's Encrypt certificate.
  # DOMAIN can be a free sslip.io name for the ECS public IP, e.g. 1-2-3-4.sslip.io
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  uploads:
  redis_data:
  caddy_data:
